global:
  registry:
    dns: solutia.azurecr.io
    path: oc-vacunas
  ingress:
    gateway: oc-vacunas-gateway
    headers: null
  developDeployment: true
  nameSpace: oc-vacunas
  imagePullSecret: solutia-acr-pull
  egress: []
microservicio:
  spec:
    environment:
      configMap:
        MP_JWT_VERIFY_PUBLICKEY_LOCATION: A_RELLENAR_POR_CTI
        MP_JWT_VERIFY_ISSUER: A_RELLENAR_POR_CTI
    authentication:
      jwt:
        issuer: A_RELLENAR_POR_CTI
        jwksUri: A_RELLENAR_POR_CTI
    replicaCount: 1
    ingress:
      enabled: false
    usageSpec:
      low:
        resources:
          requests:
            cpu: 50m
            memory: 400Mi
          limits:
            cpu: 600m
            memory: 800Mi
      medium:
        resources:
          requests:
            cpu: 100m
            memory: 600Mi
          limits:
            cpu: '1'
            memory: 1Gi
      high:
        resources:
          requests:
            cpu: 100m
            memory: 600Mi
          limits:
            cpu: '2'
            memory: 1500Mi
        autoscaling:
          minReplicas: 1
          maxReplicas: 3
          targetCPUUtilizationValue: 700m
          targetMemoryUtilizationValue: 800Mi
    service:
      port: 9080
    container:
      port: 9080
    readinessProbe:
      httpGet:
        path: /health/ready
        port: 9080
      initialDelaySeconds: 60
      timeoutSeconds: 30
      periodSeconds: 60
      failureThreshold: 6
    livenessProbe:
      httpGet:
        path: /health/live
        port: 9080
      initialDelaySeconds: 60
      timeoutSeconds: 30
      periodSeconds: 60
projects:
- configFile: projects/accion-vacunal-api.yaml
  spec:
    type: microservicio
    autoscaling:
      enabled: false
      minReplicas: 3
      maxReplicas: 3
      targetCPUUtilizationValue: 400m
      targetMemoryUtilizationValue: 400Mi
    resources:
      limits:
        cpu: '2'
        memory: 3Gi
      requests:
        cpu: 500m
        memory: 768Mi
    ingress:
      enabled: true
      host: accion-vacunal-api.oc-vacunas.10.200.201.76.nip.io
      gateway: oc-vacunas-gateway
    environment:
      configMap:
        MP_MESSAGING_CONNECTOR_LIBERTY_KAFKA_SECURITY_PROTOCOL: SASL_SSL
        MP_MESSAGING_CONNECTOR_LIBERTY_KAFKA_SASL_MECHANISM: SCRAM-SHA-512
        MP_MESSAGING_CONNECTOR_LIBERTY_KAFKA_SSL_TRUSTSTORE_TYPE: PEM
        MP_MESSAGING_CONNECTOR_LIBERTY_KAFKA_SSL_TRUSTSTORE_LOCATION: /opt/certs/aks-kafka-cluster-ca-cert.crt
        ACCIONES_TOPIC: acciones-vacunales-topic
      secretRefs:
      - movimientos-kafka-secret
      secrets:
        DB_URL_AV: jdbc:oracle:thin:@10.200.128.4:1522/bd19c02
        DB_USER_AV: APP_VAC_ACCIONES_VACUNALES
        DB_PASSWORD_AV: APP_VAC_ACCIONES_VACUNALES
        DB_URL: jdbc:oracle:thin:@10.200.128.4:1522/bd19c02
        DB_USER: APP_VAC_ACCIONES_VACUNALES
        DB_PASSWORD: APP_VAC_ACCIONES_VACUNALES
    podAnnotations:
      traffic.sidecar.istio.io/excludeOutboundPorts: '9093'
    volumeMounts:
    - name: kafka-ca-volume
      mountPath: /opt/certs/aks-kafka-cluster-ca-cert.crt
      readOnly: true
      subPath: aks-kafka-cluster-ca-cert.crt
    volumes:
    - name: kafka-ca-volume
      secret:
        secretName: movimientos-kafka-ca-secret
        items:
        - key: aks-kafka-cluster-ca-cert.crt
          path: aks-kafka-cluster-ca-cert.crt
    image:
      pullPolicy: Always
    imageTag: 1.0.2.1-SNAPSHOT
