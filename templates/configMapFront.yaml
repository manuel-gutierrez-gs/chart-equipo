apiVersion: v1
kind: ConfigMap
metadata:
  name: config-map-front
data:
 environments-configmap.json: {{ .Values.configMapFront | quote }}
{{- if .Values.configMapFrontExtra }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-map-front-extra
data:
 config-maps.json: {{ .Values.configMapFrontExtra | quote }}
{{- end }}
{{- if .Values.configMapFrontLotes }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-map-front-lotes
data:
  environments-configmap.json: {{ .Values.configMapFrontLotes | quote }}
{{- end }}
