spec:
  name: "vacunas-sincronizador-movimientos"
  version: "1.0.0"
  image:
    pullPolicy: IfNotPresent
    name: vacunas-sincronizador-movimientos
    tag: 1.0.0.1-SNAPSHOT
  replicaCount: 1
  autoscaling:
    enabled: false
  service:
    port: 9080
    sas_monitoring: false
  container:
    port: 9080
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  ingress:
    enabled: true
  trafficManagement:
    ruleSet:
      - name: "route-to-metrics"
        prefix: "/vacunas-sincronizador-movimientos/metrics"
        urlRewrite: "/metrics"
      - name: "route-to-health"
        prefix: "/vacunas-sincronizador-movimientos/health"
        urlRewrite: "/health"
  corsPolicy: ~
  authentication:
    enabled: false
  authorization:
    enabled: false
  environment:
    secrets: ~
