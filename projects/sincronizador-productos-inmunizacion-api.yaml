spec:
  name: "sincronizador-productos-inmunizacion-api"
  version: "1.0.0"
  image:
    pullPolicy: "Always"
    name: "sincronizador-productos-inmunizacion-api"
    tag: "1.0.0.2"
  replicaCount: 1
  autoscaling:
    enabled: false
  service:
    port: 9080
  container:
    port: 9080
  ingress:
    enabled: true
  trafficManagement:
    ruleSet:
    - name: "route-to-metrics"
      prefix: "/sincronizador-productos-inmunizacion-api/metrics"
      urlRewrite: "/metrics"
    - name: "route-to-health"
      prefix: "/sincronizador-productos-inmunizacion-api/health"
      urlRewrite: "/health"
  corsPolicy: ~
  authentication:
    enabled: false
  authorization:
    enabled: false
  environment:
    configMap: ~
    secrets: ~