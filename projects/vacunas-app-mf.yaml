spec:
  name: "vacunas-app-mf"
  version: "1.0.2"
  image:
    pullPolicy: "IfNotPresent"
    name: "vacunas-app-mf"
    tag: "1.0.2.2"
  replicaCount: 1
  autoscaling:
    enabled: false
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  service:
    port: 8080
  container:
    port: 8080
  ingress:
    enabled: true
  trafficManagement:
    ruleSet:
      - name: "route-to-health"
        prefix: "/microfrontales/sas/vacunas-app-mf/health"
        urlRewrite: "/health"
      - name: "route-to-service"
        prefix: ""
        urlRewrite: ""
  corsPolicy: ~
  authentication:
    enabled: false
  authorization:
    enabled: false
  environment:
    configMap: ~