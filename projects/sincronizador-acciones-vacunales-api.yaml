spec:
  name: "sincronizador-acciones-vacunales-api"
  version: "0.0.0"
  image:
    pullPolicy: "IfNotPresent"
    name: "sincronizador-acciones-vacunales-api"
    tag: "0.0.0.2"
  replicaCount: 1
  autoscaling:
    enabled: false
  service:
    port: 9080
  container:
    port: 9080
  ingress:
    enabled: true
  trafficManagement:
    ruleSet:
      - name: "route-to-metrics"
        prefix: "/sincronizador-acciones-vacunales-api/metrics"
        urlRewrite: "/metrics"
      - name: "route-to-health"
        prefix: "/sincronizador-acciones-vacunales-api/health"
        urlRewrite: "/health"
      - name: "route-to-service"
        prefix: "/sincronizador-acciones-vacunales-api/api/v1"
        urlRewrite: "/api/v1"
  corsPolicy: ~
  authentication:
    enabled: false
  authorization:
    enabled: false
  environment:
    configMap: ~