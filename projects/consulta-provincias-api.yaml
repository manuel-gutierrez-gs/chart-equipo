spec:
  name: "consulta-provincias-api"
  version: "1.0.0"
  image:
    pullPolicy: Always
    name: consulta-provincias-api
    tag: 1.0.0.2
  replicaCount: 1
  autoscaling:
    enabled: false
  service:
    port: 9080
  container:
    port: 9080
  ingress:
    enabled: true
  trafficManagement:
    ruleSet:
      - name: "route-to-metrics"
        prefix: "/consulta-provincias-api/metrics"
        urlRewrite: "/metrics"
      - name: "route-to-health"
        prefix: "/consulta-provincias-api/health"
        urlRewrite: "/health"
      - name: "route-to-service"
        prefix: "/consulta-provincias-api/api/v1"
        urlRewrite: "/api/v1"
  corsPolicy: ~
  authentication:
    enabled: false
  authorization:
    enabled: false
  environment:
    configMap: ~