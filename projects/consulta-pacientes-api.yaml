spec:
  name: "consulta-pacientes-api"
  version: "1.0.0"
  image:
    pullPolicy: "Always"
    name: "consulta-pacientes-api"
    tag: "1.0.0.1-digicert"
  replicaCount: 1
  autoscaling:
    enabled: false
  service:
    port: 9080
  container:
    port: 9080
  ingress:
    enabled: true
  trafficManagement:
    ruleSet:
    - name: "route-to-metrics"
      prefix: "/consulta-pacientes-api/metrics"
      urlRewrite: "/metrics"
    - name: "route-to-health"
      prefix: "/consulta-pacientes-api/health"
      urlRewrite: "/health"
    - name: "route-to-service"
      prefix: "/consulta-pacientes-api/api/v1"
      urlRewrite: "/api/v1"
  corsPolicy: ~
  authentication:
    enabled: false
  authorization:
    enabled: false
  environment:
    configMap: ~
    secrets: ~