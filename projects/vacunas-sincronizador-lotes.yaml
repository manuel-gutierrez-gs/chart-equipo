spec:
  name: "vacunas-sincronizador-lotes"
  version: "1.0.0"
  image:
    pullPolicy: "Always"
    name: "vacunas-sincronizador-lotes"
    tag: "1.0.0.1-SNAPSHOT"
  replicaCount: 1
  autoscaling:
    enabled: false
  service:
    port: 9080
  container:
    port: 9080
  ingress:
    enabled: true
  trafficManagement:
    ruleSet:
    - name: "route-to-metrics"
      prefix: "/vacunas-sincronizador-lotes/metrics"
      urlRewrite: "/metrics"
    - name: "route-to-health"
      prefix: "/vacunas-sincronizador-lotes/health"
      urlRewrite: "/health"
  corsPolicy: ~
  authentication:
    enabled: false
  authorization:
    enabled: false
  environment:
    configMap: ~
    secrets: ~